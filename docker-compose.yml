services:
  mysql:
    image: mysql:8.4
    container_name: vaishnavi-bookstore-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vaishnavi_bookstore
      MYSQL_USER: bookstore
      MYSQL_PASSWORD: bookstore
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ubookstore", "-pbookstore"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: vaishnavi-bookstore-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/vaishnavi_bookstore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      DB_USERNAME: bookstore
      DB_PASSWORD: bookstore
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: vaishnavi-bookstore-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
